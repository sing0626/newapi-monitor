name: NewAPIMonitor
options:
  bundleIdPrefix: com.newapimonitor
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  NewAPIMonitor:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NewAPIMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newapimonitor.ios
        PRODUCT_NAME: NewAPIMonitor
        INFOPLIST_FILE: NewAPIMonitor/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NewAPIMonitor/Resources/NewAPIMonitor.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  NewAPIMonitorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NewAPIMonitorTests
    dependencies:
      - target: NewAPIMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newapimonitor.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  NewAPIMonitor:
    build:
      targets:
        NewAPIMonitor: all
        NewAPIMonitorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NewAPIMonitorTests
    archive:
      config: Release
