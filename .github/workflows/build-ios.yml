name: Build iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode toolchain
        run: xcodebuild -version
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Validate project resources
        run: python3 ios/scripts/check-project.py
      - name: Run simulator unit tests
        run: bash ios/scripts/test-ios.sh
      - name: Build and validate unsigned device IPA
        id: package
        run: bash ios/scripts/build-unsigned-ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NewAPIMonitor-iOS-unsigned
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: ios/build/tests.*/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
